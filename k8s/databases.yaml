apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: enterprise-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: enterprise-platform
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, tier: database }
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: enterprise }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 256Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: enterprise-platform
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: enterprise-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: enterprise-platform
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql, tier: database }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: auth_db }
            - { name: MYSQL_USER, value: auth_user }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: MYSQL_PASSWORD } } }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: MYSQL_ROOT_PASSWORD } } }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD --silent"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: enterprise-platform
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-data
  namespace: enterprise-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: enterprise-platform
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: oracle }
  template:
    metadata:
      labels: { app: oracle, tier: database }
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports: [{ containerPort: 1521 }]
          env:
            - { name: APP_USER, value: payment }
            - { name: APP_USER_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: ORACLE_APP_PASSWORD } } }
            - { name: ORACLE_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: ORACLE_PASSWORD } } }
          readinessProbe:
            exec: { command: ["healthcheck.sh"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests: { memory: 1536Mi, cpu: 100m }
            limits: { memory: 1536Mi }
          volumeMounts: [{ name: data, mountPath: /opt/oracle/oradata }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: oracle-data }
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: enterprise-platform
spec:
  selector: { app: oracle }
  ports: [{ port: 1521, targetPort: 1521 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: cache }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: enterprise-platform
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
