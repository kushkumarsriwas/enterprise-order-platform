# Sign-up, sign-in (JWT RS256 with a JWKS endpoint), accounts and the administrator. Database: MySQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: enterprise-platform
  labels: { app: auth-service, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: auth-service, tier: backend }
    spec:
      containers:
        - name: auth-service
          image: enterprise/auth-service:3.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8081 }]
          # service URLs (AUTH_JWKS_URI, ORDER_SERVICE_URL, ...) from the shared ConfigMap
          envFrom: [{ configMapRef: { name: platform-config } }]
          env:
            - { name: PORT, value: "8081" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -Xss512k" }
            - { name: INTERNAL_API_KEY, valueFrom: { secretKeyRef: { name: platform-secrets, key: INTERNAL_API_KEY } } }
            - { name: SPRING_PROFILES_ACTIVE, value: "mysql" }
            - { name: SPRING_DATASOURCE_URL, valueFrom: { configMapKeyRef: { name: platform-config, key: MYSQL_URL } } }
            - { name: SPRING_DATASOURCE_USERNAME, value: "auth_user" }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: MYSQL_PASSWORD } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: ADMIN_PASSWORD } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 512Mi }
