apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-auth
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-auth
  template:
    metadata:
      labels:
        app: enterprise-auth
    spec:
      containers:
        - name: auth
          image: enterprise-auth:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              value: 852852
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-auth
  namespace: enterprise-platform
spec:
  selector:
    app: enterprise-auth
  ports:
    - port: 8081
      targetPort: 8081
