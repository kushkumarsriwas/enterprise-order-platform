apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-oracle
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-oracle
  template:
    metadata:
      labels:
        app: enterprise-oracle
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports:
            - containerPort: 1521
            - containerPort: 5500
          env:
            - name: ORACLE_PASSWORD
              value: '852852'
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-oracle
  namespace: enterprise-platform
spec:
  selector:
    app: enterprise-oracle
  ports:
    - name: oracle
      port: 1521
      targetPort: 1521
    - name: https
      port: 5500
      targetPort: 5500
