# The single entry point: routes /api/** to the services, CORS, rate limiting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: enterprise-platform
  labels: { app: api-gateway, tier: edge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: api-gateway, tier: edge }
    spec:
      containers:
        - name: api-gateway
          image: enterprise/api-gateway:3.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          # service URLs (AUTH_JWKS_URI, ORDER_SERVICE_URL, ...) from the shared ConfigMap
          envFrom: [{ configMapRef: { name: platform-config } }]
          env:
            - { name: PORT, value: "8080" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -Xss512k" }
            - { name: INTERNAL_API_KEY, valueFrom: { secretKeyRef: { name: platform-secrets, key: INTERNAL_API_KEY } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 512Mi }
