apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: enterprise-platform
  labels: { app: api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway, tier: backend }
    spec:
      containers:
        - name: api-gateway
          image: enterprise/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -Xss512k" }
            - { name: AUTH_SERVICE_URL, valueFrom: { configMapKeyRef: { name: platform-config, key: AUTH_SERVICE_URL } } }
            - { name: PRODUCT_SERVICE_URL, valueFrom: { configMapKeyRef: { name: platform-config, key: PRODUCT_SERVICE_URL } } }
            - { name: ORDER_SERVICE_URL, valueFrom: { configMapKeyRef: { name: platform-config, key: ORDER_SERVICE_URL } } }
            - { name: PAYMENT_SERVICE_URL, valueFrom: { configMapKeyRef: { name: platform-config, key: PAYMENT_SERVICE_URL } } }
            - { name: NOTIFICATION_SERVICE_URL, valueFrom: { configMapKeyRef: { name: platform-config, key: NOTIFICATION_SERVICE_URL } } }
            - { name: CORS_ALLOWED_ORIGINS, valueFrom: { configMapKeyRef: { name: platform-config, key: CORS_ALLOWED_ORIGINS } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: enterprise-platform
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
