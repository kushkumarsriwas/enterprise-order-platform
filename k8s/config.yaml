# Non-secret settings shared by the services
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: enterprise-platform
data:
  AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  AUTH_SERVICE_URL: http://auth-service:8081
  PRODUCT_SERVICE_URL: http://product-inventory-service:8082
  ORDER_SERVICE_URL: http://order-service:8083
  PAYMENT_SERVICE_URL: http://payment-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8085
  POSTGRES_URL: jdbc:postgresql://postgres:5432/enterprise
  MYSQL_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  ORACLE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
  CORS_ALLOWED_ORIGINS: http://localhost:30000,http://localhost:3000
---
# Demo credentials (in a real cluster these come from a vault / sealed secrets, never from git)
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: enterprise-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  MYSQL_ROOT_PASSWORD: root_pass
  MYSQL_PASSWORD: auth_pass
  ORACLE_PASSWORD: oracle_admin
  ORACLE_APP_PASSWORD: payment_pass
