apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: web }
    spec:
      containers:
        - name: frontend
          image: enterprise/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          env:
            - { name: GATEWAY_URL, value: "http://api-gateway:8080" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: enterprise-platform
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30000 }]
