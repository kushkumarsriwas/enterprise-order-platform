# Horizontal scaling of the order service: 2 to 5 pods at 70% CPU (needs metrics-server in the cluster).
# By hand:  kubectl -n enterprise-platform scale deployment order-service --replicas=3
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: enterprise-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
