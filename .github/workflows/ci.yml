
name: Enterprise Order Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE product_inventory_service"
          psql -h localhost -U postgres -c "CREATE DATABASE order_service"
          psql -h localhost -U postgres -c "CREATE DATABASE enterprise_platform"
          psql -h localhost -U postgres -c "CREATE DATABASE auth_service"
          psql -h localhost -U postgres -c "CREATE DATABASE notification_service"

      - name: Test Product Inventory Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/product_inventory_service
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: '6379'
        run: mvn -f services/product-inventory-service/pom.xml test

      - name: Test Order Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/order_service
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -f services/order-service/pom.xml test

      - name: Test Payment Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/enterprise_platform
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -f services/payment-service/pom.xml test

      - name: Test Auth Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/auth_service
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -f services/auth-service/pom.xml test

      - name: Test Notification Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notification_service
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -f services/notification-service/pom.xml test

      - name: Test API Gateway
        run: mvn -f gateway/pom.xml test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  deploy-gateway:
    name: Deploy Gateway to Render
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_GATEWAY_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"

  deploy-frontend:
    name: Deploy Frontend to Render
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"
