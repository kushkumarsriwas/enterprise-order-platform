# Continuous integration: runs on every push to main, develop and feature/** branches and on every pull request.
#
#   Compile -> Unit tests -> Integration tests -> Code quality -> Package JAR -> Build Docker image -> Deploy (cd.yml)
#
#   backend      one job per Java service, in parallel: compile, unit tests, integration tests, coverage, package the JAR
#   web          storefront and Control Center: lint, format check, production build
#   code-quality CodeQL static analysis of the Java and JavaScript code (public repositories)
#   kubernetes   render the k8s/ and deploy/aws manifests and validate them against the Kubernetes API schemas
#   e2e          the packaged JARs against PostgreSQL + Redis, driven through the gateway (scripts/smoke-test.mjs)
#   docker       an image for every service and both web applications; pushed to GitHub Container Registry from main
#
# When this workflow succeeds on main, cd.yml deploys (Render, and AWS EKS when it is configured).
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JACOCO: org.jacoco:jacoco-maven-plugin:0.8.13

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth-service, path: services/auth-service }
          - { service: product-service, path: services/product-inventory-service }
          - { service: order-service, path: services/order-service }
          - { service: payment-service, path: services/payment-service }
          - { service: notification-service, path: services/notification-service }
          - { service: api-gateway, path: gateway }
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml
      - name: Download dependencies
        # Maven Central sometimes drops connections when many jobs download at once: retry before failing
        run: |
          for attempt in 1 2 3; do
            mvn -B -ntp dependency:go-offline > deps.log 2>&1 && exit 0
            echo "Dependency download failed (attempt $attempt of 3):"; grep -E "^\[ERROR\]" deps.log | head -5
            sleep 15
          done
          exit 1
      - name: Compile
        run: mvn -B -ntp test-compile
      - name: Unit tests (JUnit 5, Mockito, MockMvc)
        run: mvn -B -ntp $JACOCO:prepare-agent test -Dtest='!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Integration tests (Spring Boot, H2, Testcontainers PostgreSQL)
        run: mvn -B -ntp $JACOCO:prepare-agent test -Dtest='*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Test coverage (JaCoCo)
        run: |
          mvn -B -ntp -q $JACOCO:report
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, -v name="${{ matrix.service }}" 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
              END {
                printf "### Test coverage: %s\n\n| Lines | Branches |\n| --- | --- |\n", name
                printf "| %.1f%% (%d of %d) | %.1f%% |\n", 100 * lc / (lm + lc), lc, lm + lc, (bm + bc) ? 100 * bc / (bm + bc) : 100
              }' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package JAR
        run: mvn -B -ntp -q package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.path }}/target/app.jar
          retention-days: 7
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.path }}/target/surefire-reports

  web:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Production build
        run: npm run build

  code-quality:
    name: Code quality (CodeQL ${{ matrix.language }})
    # Code scanning is free for public repositories; a private one needs GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Render with kustomize (local cluster and AWS EKS)
        run: |
          cp k8s/config/secrets.env.example k8s/config/secrets.env
          kubectl kustomize k8s > rendered-local.yaml
          kubectl kustomize deploy/aws > rendered-aws.yaml
          grep -c "^kind:" rendered-local.yaml rendered-aws.yaml
      - name: Validate against the Kubernetes API schemas (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 rendered-local.yaml rendered-aws.yaml

  e2e:
    name: End-to-end test
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: enterprise
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      # a throw-away database that lives for this job only
      ADMIN_PASSWORD: ci-admin-${{ github.run_id }}
      INTERNAL_API_KEY: ci-internal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Start the six services
        run: |
          mkdir -p logs
          start() { PORT=$2 nohup java -Xmx320m -XX:TieredStopAtLevel=1 -jar jars/jar-$1/app.jar > logs/$1.log 2>&1 & }
          start auth-service 8081
          sleep 15
          start product-service 8082
          start order-service 8083
          start payment-service 8084
          start notification-service 8085
          start api-gateway 8080
          for port in 8081 8082 8083 8084 8085 8080; do
            for i in $(seq 1 90); do curl -fs "localhost:$port/actuator/health" > /dev/null && break; sleep 2; done
            curl -fs "localhost:$port/actuator/health" > /dev/null || { echo "::error::service on port $port did not start"; exit 1; }
          done
      - name: Smoke test through the gateway
        run: node scripts/smoke-test.mjs http://localhost:8080
      - name: Keep the service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs

  docker:
    name: Docker image ${{ matrix.image }}
    needs: [backend, web, code-quality, kubernetes, e2e]
    # runs when everything before passed (code quality is skipped on private repositories)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth-service, context: services/auth-service }
          - { image: product-service, context: services/product-inventory-service }
          - { image: order-service, context: services/order-service }
          - { image: payment-service, context: services/payment-service }
          - { image: notification-service, context: services/notification-service }
          - { image: api-gateway, context: gateway }
          - { image: frontend, context: frontend }
          - { image: admin-frontend, context: admin }
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eop-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/eop-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexora-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
