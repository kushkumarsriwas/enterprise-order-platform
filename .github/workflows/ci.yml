name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 1) Compile + unit tests + integration tests (H2 / MockMvc) for every service, in parallel
  backend:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/auth-service
          - services/product-inventory-service
          - services/order-service
          - services/payment-service
          - services/notification-service
          - gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify -f ${{ matrix.module }}/pom.xml
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ strategy.job-index }}
          path: ${{ matrix.module }}/target/surefire-reports

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  # 2) End-to-end: all six services against a real PostgreSQL + Redis, driven through the gateway
  e2e:
    name: End-to-end smoke test
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: enterprise
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package all services
        run: mvn -B -ntp -q package -DskipTests
      - name: Start services
        run: |
          mkdir -p logs
          start() { PORT=$2 nohup java -Xmx256m -jar $3 > logs/$1.log 2>&1 & }
          start auth 8081 services/auth-service/target/app.jar
          sleep 15
          start inventory 8082 services/product-inventory-service/target/app.jar
          start order 8083 services/order-service/target/app.jar
          start payment 8084 services/payment-service/target/app.jar
          start notification 8085 services/notification-service/target/app.jar
          start gateway 8080 gateway/target/app.jar
          for port in 8080 8081 8082 8083 8084 8085; do
            for i in $(seq 1 60); do curl -fs localhost:$port/actuator/health > /dev/null && break; sleep 3; done
          done
      - name: Run smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs

  # 3) Build every Docker image; on main also publish them to GitHub Container Registry
  docker:
    name: Docker image ${{ matrix.image }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth-service, context: services/auth-service }
          - { image: product-inventory-service, context: services/product-inventory-service }
          - { image: order-service, context: services/order-service }
          - { image: payment-service, context: services/payment-service }
          - { image: notification-service, context: services/notification-service }
          - { image: api-gateway, context: gateway }
          - { image: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eop-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/eop-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 4) Deploy: Render rebuilds the gateway and the frontend only when everything above is green
  deploy:
    name: Deploy ${{ matrix.target }} to Render
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [gateway, frontend]
    steps:
      - name: Trigger Render deploy hook
        env:
          GATEWAY_HOOK: ${{ secrets.RENDER_GATEWAY_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          HOOK=$([ "${{ matrix.target }}" = "gateway" ] && echo "$GATEWAY_HOOK" || echo "$FRONTEND_HOOK")
          if [ -z "$HOOK" ]; then echo "Deploy hook secret not configured - skipping"; exit 0; fi
          curl --fail --silent --show-error --request POST "$HOOK"
