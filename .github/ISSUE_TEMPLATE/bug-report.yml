name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in to Seller Central as alnoor
        2. Open Purchase orders and receive PO-...
        3. ...
    validations:
      required: true
  - type: input
    id: correlation
    attributes:
      label: Correlation id
      description: The correlationId of the error response (it finds the request in every service's log).
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Marketplace, Seller Central, Control Center, API, Deployment]
