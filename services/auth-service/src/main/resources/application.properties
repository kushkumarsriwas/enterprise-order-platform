spring.application.name=auth-service
server.port=${PORT:8081}

# Database profile: "postgres" by default (Render, CI, K8s), "mysql" in docker compose.
spring.profiles.default=postgres
spring.profiles.group.render=postgres

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

security.jwt.issuer=enterprise-auth
security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Demo accounts 'customer' / 'seller' (tests only; production starts empty)
app.seed.demo-accounts=${DEMO_ACCOUNTS:false}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Identity service (JWT RS256 + JWKS)

springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]
