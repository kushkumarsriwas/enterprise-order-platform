spring.application.name=auth-service
server.port=${PORT:8081}

# Database profile: "postgres" by default (Render, CI, K8s), "mysql" in docker compose.
spring.profiles.default=postgres
spring.profiles.group.render=postgres

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Suspending a merchant hides the store's products in the product and inventory service
clients.inventory.url=${PRODUCT_SERVICE_URL:http://localhost:8082}

security.jwt.issuer=enterprise-auth
security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

app.seed.admin-password=${ADMIN_PASSWORD:Admin@12345}
app.seed.customer-password=${DEMO_CUSTOMER_PASSWORD:Customer@12345}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Identity service (JWT RS256 + JWKS)

springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]
