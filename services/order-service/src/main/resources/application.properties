spring.application.name=order-service
server.port=${PORT:8083}

spring.profiles.default=postgres
spring.profiles.group.render=postgres

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Loads order items/history for a whole page in one extra query instead of N queries (N+1 problem)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

app.orders.payment-window=30m

security.jwt.issuer=enterprise-auth
security.jwt.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
clients.inventory.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
clients.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
clients.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]
