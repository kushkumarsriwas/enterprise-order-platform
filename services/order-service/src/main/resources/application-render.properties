# Activated automatically on Render (see Dockerfile entrypoint). Includes the "postgres" profile.
security.jwt.jwks-uri=${AUTH_JWKS_URI:https://enterprise-auth.onrender.com/.well-known/jwks.json}
security.jwt.jwks-timeout=90s
clients.inventory.url=${PRODUCT_SERVICE_URL:https://enterprise-product-inventory.onrender.com}
clients.payment.url=${PAYMENT_SERVICE_URL:https://enterprise-payment.onrender.com}
clients.notification.url=${NOTIFICATION_SERVICE_URL:https://enterprise-notification.onrender.com}
clients.auth.url=${AUTH_SERVICE_URL:https://enterprise-auth.onrender.com}
# Empty = derived from the shared database password (see InternalApiKey)
app.internal.api-key=${INTERNAL_API_KEY:}
clients.read-timeout=90s
