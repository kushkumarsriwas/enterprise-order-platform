spring.application.name=product-inventory-service
server.port=${PORT:8082}

spring.profiles.default=postgres
spring.profiles.group.render=postgres

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Redis (Render injects SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
app.cache.ttl=10m
app.cache.home-ttl=60s

# Product photos (2 MB) and Excel uploads
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
management.health.redis.enabled=false

# Unpaid reservations are released after this time (order service cancels unpaid orders after 30m)
app.reservation.ttl=40m

security.jwt.issuer=enterprise-auth
security.jwt.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
clients.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]
