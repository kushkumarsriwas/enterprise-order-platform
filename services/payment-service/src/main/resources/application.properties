spring.application.name=payment-service
server.port=${PORT:8084}

# Database profile: "postgres" by default (Render, CI, K8s), "oracle" in docker compose.
spring.profiles.default=postgres
spring.profiles.group.render=postgres

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Marketplace commission kept by the platform on every sale (5%)
app.platform.fee-rate=0.05

security.jwt.issuer=enterprise-auth
security.jwt.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
clients.order.url=${ORDER_SERVICE_URL:http://localhost:8083}
clients.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]
