spring.application.name=notification-service
server.port=${PORT:8085}

spring.profiles.default=postgres
spring.profiles.group.render=postgres

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

security.jwt.issuer=enterprise-auth
security.jwt.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
clients.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Shared secret for service-to-service calls (/internal/**); use the same value on every service
app.internal.api-key=${INTERNAL_API_KEY:nexora-local-internal-key}
# Sender of the platform e-mails (LoggingEmailSender writes them to the log)
app.mail.from=Nexora <no-reply@nexora.ae>

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]
