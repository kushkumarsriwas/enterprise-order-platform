<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta
      name="description"
      content="Nexora is a UAE marketplace where independent stores sell to customers across the Emirates, with Seller Central for inventory, orders and finances."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexora - shop independent stores across the UAE</title>
    <script>
      // Light unless the visitor picked dark with the theme switch; applied before the first paint.
      // A choice saved by an older version (key "nexora_theme") is dropped once, so everyone starts in light.
      try {
        localStorage.removeItem("nexora_theme");
        if (localStorage.getItem("nexora-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
