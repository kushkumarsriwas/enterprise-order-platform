<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1631" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Nexora Control Center: the administrator's console for the Nexora marketplace." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexora Control Center</title>
    <!-- deployment settings (the marketplace address); in Docker, nginx writes this file when the container starts -->
    <script src="/config.js"></script>
    <script>
      // Light unless the visitor picked dark with the theme switch; applied before the first paint.
      // A choice saved by an older version (key "nexora_theme") is dropped once, so everyone starts in light.
      try {
        localStorage.removeItem("nexora_theme");
        if (localStorage.getItem("nexora-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
