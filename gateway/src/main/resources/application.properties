spring.application.name=api-gateway
server.port=${PORT:8080}

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://enterprise-auth:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUCT_SERVICE_URL:http://enterprise-product-inventory:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_URL:http://enterprise-order:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${PAYMENT_SERVICE_URL:http://enterprise-payment:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://enterprise-notification:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**

management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.server.webmvc.routes[5].id=auth-user-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${AUTH_SERVICE_URL:http://enterprise-auth:8081}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/users/**
