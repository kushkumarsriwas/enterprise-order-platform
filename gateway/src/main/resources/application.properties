spring.application.name=api-gateway
server.port=${PORT:8080}
spring.threads.virtual.enabled=true

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.inventory.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.order.url=${ORDER_SERVICE_URL:http://localhost:8083}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=30s

security.jwt.issuer=enterprise-auth
security.jwt.jwks-uri=${services.auth.url}/.well-known/jwks.json

# Marketplace (3000) and the separate administrator console (3001), locally and on Render
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,http://localhost:4173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://enterprise-frontend*.onrender.com,https://enterprise-admin*.onrender.com}
app.rate-limit.auth-per-minute=20
app.rate-limit.admin-login-per-minute=5

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
info.app.name=${spring.application.name}

# Services the API documentation page (/docs) wakes from the visitor's browser before opening Swagger UI.
# Empty here; set on Render, where free services sleep (see application-render.properties).
app.wake-urls=

# One Swagger UI for the whole platform (each entry is proxied to a service's /v3/api-docs)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Accounts, Stores & Admin
springdoc.swagger-ui.urls[0].url=/api-docs/auth
springdoc.swagger-ui.urls[1].name=Products & Inventory
springdoc.swagger-ui.urls[1].url=/api-docs/inventory
springdoc.swagger-ui.urls[2].name=Orders, Analytics & Reviews
springdoc.swagger-ui.urls[2].url=/api-docs/orders
springdoc.swagger-ui.urls[3].name=Payments & Finance
springdoc.swagger-ui.urls[3].url=/api-docs/payments
springdoc.swagger-ui.urls[4].name=Notifications & Messages
springdoc.swagger-ui.urls[4].url=/api-docs/notifications

logging.pattern.level=%5p [%X{correlationId:-}]
