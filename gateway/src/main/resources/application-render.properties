# Activated automatically on Render (see Dockerfile entrypoint). Free instances can take ~60s to wake up.
spring.http.clients.read-timeout=90s
security.jwt.jwks-timeout=90s
# Free services are woken only by requests from outside Render, not by this gateway's calls: /docs wakes
# them from the visitor's browser (the web apps do the same with VITE_WAKE_URLS)
app.wake-urls=${services.auth.url},${services.inventory.url},${services.order.url},${services.payment.url},${services.notification.url}
